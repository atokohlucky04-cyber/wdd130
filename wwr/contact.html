<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=5">
    <title>Contact Us | Whitewater Rafting</title>
    <link rel="stylesheet" href="rafting.css">
    <meta name="description" content="Contact Whitewater Rafting for general inquiries, reservation questions, and website suggestions.">
    <meta name="author" content="Your Name">

</head>
<body>
    <header>
        <img src="images/logo.jpg" alt="Whitewater Rafting Logo">
        <nav class="navbar">
            <a href="index.html">Home</a>

            <a href="about.html">About Us</a>
        

            <a href="trips.html">Trips</a>

            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h2>Contact Information</h2>
            <p><strong>Address:</strong> 123 River Road, Rafting City, CO 80424</p>
            <p><strong>Phone:</strong> (555) 123-4567</p>
            <p><strong>Email:</strong> info@whitewaterrafting.com</p>
            
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6758075.622385424!2d-118.72313851955698!3d34.20152305960768!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8737e89b70298547%3A0x165dff811dd0901e!2sColorado%20River!5e0!3m2!1sen!2sng!4v1790774934414!5m2!1sen!2sng" width="600" height="450" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </section>

        <section class="employees">
            <h2>Our Team</h2>
            <figure>
                <img src="images/employee1.jpg" alt="Jane Doe">
                <figcaption>Jane Doe - Head River Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="John Smith">
                <figcaption>John Smith - Safety Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Sarah Lee">
                <figcaption>Sarah Lee - Customer Service</figcaption>
            </figure>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form action="#" method="POST">
                <label for="user_name">Name:</label>
                <input type="text" id="user_name" name="user_name" required>

                <label for="user_email">Email:</label>
                <input type="email" id="user_email" name="user_email" required>

                <fieldset>
                    <legend>Purpose of Message:</legend>
                    <input type="radio" id="general" name="purpose" value="General Inquiry" checked>
                    <label for="general">General Inquiry</label><br>
                    
                    <input type="radio" id="reservation" name="purpose" value="Reservation Question">
                    <label for="reservation">Reservation Question</label><br>
                    
                    <input type="radio" id="website" name="purpose" value="Website Suggestion">
                    <label for="website">Website Suggestion</label>
                </fieldset>

                <label for="user_message">Message:</label>
                <textarea id="user_message" name="user_message" rows="4" required></textarea>

                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Please subscribe me to the monthly newsletter</label>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Whitewater Rafting | Lucky Ado Atokoh</p>
        <nav class="sociallinks">
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook"></a>
            <a href="https://twitter.com"><img src="images/twitter.png" alt="Twitter"></a>
            <a href="https://instagram.com"><img src="images/instagram.png" alt="Instagram"></a>
        </nav>
    </footer>
</body>
</html>
